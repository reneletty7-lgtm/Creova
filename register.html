<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creova - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="register-container">
  <h1>Creova</h1>
  <p>Welcome to Creova where every dream and creation comes to life</p>
  <h2>Create an account</h2>

  <form id="registerForm">
    <label for="name">Full name</label>
    <input type="text" id="name" placeholder="Enter your full name" required>

    <label for="contact">Email or Phone number</label>
    <input type="text" id="contact" placeholder="Email or phone number" required>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Create password" required>

    <label for="confirmPassword">Confirm password</label>
    <input type="password" id="confirmPassword" placeholder="Confirm password" required>

    <button type="submit">Register</button>
  </form>

  <p>Already have an account? <a href="login.html">sign in/login</a></p>
</div>

<script src="script.js"></script>
<script src="install.js"></script>
</body>
</html>
